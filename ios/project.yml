name: MapMiami
options:
  bundleIdPrefix: app.mapmiami
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7862JJJ2V4
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MapMiami:
    type: application
    platform: iOS
    sources:
      - path: MapMiami
      - path: Shared
        excludes:
          - FloodTimeline.swift
    dependencies:
      - target: MapMiamiWidgets
        embed: true
      - target: MapMiamiWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mapmiami.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MapMiami/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Map Miami
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Survive Miami uses your location as the start of a drive and to guide you along the chosen route.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  MapMiamiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MapMiamiWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mapmiami.ios.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MapMiamiWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Map Miami
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  MapMiamiWatch:
    type: application
    platform: watchOS
    sources:
      - path: MapMiamiWatch
      - path: Shared
        excludes:
          - TripActivity.swift
          - FloodTimeline.swift
    dependencies:
      - target: MapMiamiWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mapmiami.ios.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MapMiamiWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Map Miami
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.mapmiami.ios
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
  MapMiamiWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: MapMiamiWatchWidgets
      - path: Shared
        excludes:
          - TripActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mapmiami.ios.watch.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MapMiamiWatchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Miami flood alert
  MapMiamiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MapMiamiTests
      - path: MapMiami/RouteGuidance.swift
      - path: Shared
        excludes:
          - FloodTimeline.swift
          - TripActivity.swift
          - FloodStatusView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mapmiami.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  MapMiami:
    build:
      targets:
        MapMiami: all
        MapMiamiWidgets: all
        MapMiamiWatch: all
        MapMiamiWatchWidgets: all
        MapMiamiTests: [test]
    test:
      targets:
        - MapMiamiTests
  MapMiamiLogic:
    build:
      targets:
        MapMiamiTests: [test]
    test:
      targets:
        - MapMiamiTests
